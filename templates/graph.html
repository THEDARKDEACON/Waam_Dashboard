<body>

    <div id="toggle-container">

    <div id="chart-area">

    <script>

        const c = {
            red: "#FF1654",
            blue: "#247BA0",
            yellow: "#FEB019",
            green: "#00E396",
            purple: "#775DD0",
            annotationColour: '#447BA0',

            strokeWidth: 3,
            markerSize: 0,
            // lineType: "smooth",
            lineType: "straight",

            // timeColumnName: "Time (S)",
            // T1ColumnName: "T1(°C),Raw",
            // T2ColumnName: "T2(°C),Raw",
            // T3ColumnName: "T3(°C),Raw",
            // T4ColumnName: "T4(°C),Raw",
            // voltageColumnName: "V(Volts),Raw",
            // currentColumnName: "C(Amps),Raw",
            // WFSColumnName: "E(mm/S),Raw",
            // torchOnColumnName: "Torch-on",

            timeColumnName: "timestamp",
            T1ColumnName: "T1",
            T2ColumnName: "T2",
            T3ColumnName: "T3",
            T4ColumnName: "T4",
            voltageColumnName: "V",
            currentColumnName: "C",
            WFSColumnName: "E",
            torchOnColumnName: "Torch-on",

            voltageRMSthresh: 3,
            currentRMSthresh: 10,

            cleanedFlag: 'cleaned',
            rawFlag: 'raw',
            sampleFlag: 'sampled',
            sampleInterval: 1.0, // seconds
        };


        var columns = [];
        var allData = [];
        var ann = [];


        function renderChart(seriesData, chartID, yAxisTitle = "Value") {
            let xAxisTitle = c.timeColumnName;
            let group = "sync-charts";

            var options = {
                chart: {
                    id: chartID.replace("#", ""),
                    group: group,
                    height: 250,
                    type: "line",
                    stacked: false,

                    zoom: {
                        enabled: false
                    },

                    animations: {
                        enabled: true,
                        speed: 350,
                        animateGradually: {
                            enabled: false,
                        },
                        dynamicAnimation: {
                            enabled: true,
                            speed: 350
                        }
                    }

                },

                dataLabels: {
                    enabled: false
                },

                colors: [c.red, c.blue, c.green, c.yellow, c.purple].slice(0, seriesData.length),

                series: seriesData,

                stroke: {
                    width: seriesData.map(() => c.strokeWidth),
                    curve: c.lineType
                },
                markers: {
                    size: c.markerSize,
                },
                xaxis: {
                    type: "numeric",
                    tickAmount: 11,

                    title: {
                        text: xAxisTitle
                    }
                },
                yaxis: {

                    min: undefined,
                    max: undefined,
                    stepSize: undefined,

                    decimalsInFloat: false,
                    forceNiceScale: true,

                    labels: {
                        minWidth: 120,
                        maxWidth: 120,
                    },

                    axisTicks: {
                        show: true
                    },
                    axisBorder: {
                        show: true,
                    },

                    title: {
                        text: yAxisTitle,
                        rotate: 0,
                        offsetX: -30
                    }
                },

                tooltip: {
                    shared: true,
                    intersect: false,
                    x: {
                        show: false
                    }
                },
                legend: {
                    show: true,
                    position: "right",
                    width: 150,
                    offsetY: 100
                },

                grid: {
                    xaxis: {
                        lines: {
                            show: true
                        }
                    },
                    yaxis: {
                        lines: {
                            show: true
                        }
                    },
                },

                annotations: {
                    xaxis: ann,
                }
            };
            if (dashboard.charts[chartID]) {
                dashboard.charts[chartID].destroy();
            }

            var chart = new ApexCharts(document.querySelector(chartID), options);
            chart.render();
            return chart;
        }

        const dashboard = {
            currentView: c.rawFlag,
            charts: {},
            data: {
                raw: {},
                cleaned: {},
                sampled: {}
            }
        };

        function updateViewIndicator() {
            const el = document.getElementById("view-indicator");
            if (el) el.innerText = dashboard.currentView;
        }

        function toggleDataView() {
            const btn = document.getElementById("toggle-view-btn");

            if (dashboard.currentView === c.rawFlag) {
                dashboard.currentView = c.cleanedFlag;
                btn.innerText = "Sample";
            } else if (dashboard.currentView === c.cleanedFlag) {
                dashboard.currentView = c.sampleFlag;
                btn.innerText = "Raw";
            } else {
                dashboard.currentView = c.rawFlag;
                btn.innerText = "Clean";
            }

            updateViewIndicator();

            const currentSet = dashboard.data[dashboard.currentView];
            Object.keys(dashboard.charts).forEach(id => {
                const newData = currentSet[id];
                if (newData) {
                    dashboard.charts[id].updateOptions({
                        series: newData,
                        annotations: {
                            xaxis: currentSet.annotations
                        }
                    }, false, true, false);
                }
            });
        }

        function hampelFilter(data, windowSize = 20, nSigmas = 2) {

            const cleaned = [...data];
            const halfWindow = Math.floor(windowSize / 2);

            for (let i = halfWindow; i < data.length - halfWindow; i++) {
                const window = data.slice(i - halfWindow, i + halfWindow + 1);

                const sortedWindow = [...window].sort((a, b) => a - b);
                const median = sortedWindow[Math.floor(window.length / 2)];

                // Median Absolute Deviation
                const ad = window.map(v => Math.abs(v - median));
                const sortedAd = ad.sort((a, b) => a - b);
                const mad = sortedAd[Math.floor(ad.length / 2)];

                const sigma = 1.4826 * mad;

                if (Math.abs(data[i] - median) > nSigmas * sigma) {
                    cleaned[i] = median;
                }
            }
            return cleaned;
        }

        function simpleDeleteFilter(data, thresh = 8) {
            const cleaned = [...data];

            for (let i = 1; i < data.length; i++) {
                var diff = data[i] - data[i - 1];

                if (Math.abs(diff) > thresh) {
                    cleaned[i] = null;
                }
            }
            return cleaned;
        }

        function rmsAvg(data, threshold) {
            const result = new Array(data.length).fill(0);
            let i = 0;

            while (i < data.length) {
                if (Math.abs(data[i]) > threshold) {
                    let start = i;
                    let sumSquares = 0;

                    while (i < data.length && Math.abs(data[i]) > threshold) {
                        sumSquares += Math.pow(data[i], 2);
                        i++;
                    }

                    let end = i;
                    let segmentLength = end - start;

                    let rmsValue = Math.sqrt(sumSquares / segmentLength);

                    for (let j = start; j < end; j++) {
                        result[j] = rmsValue;
                    }
                } else {
                    result[i] = data[i];
                    i++;
                }
            }
            return result;
        }


        function simpleWFSFilter(data, threshold = 10) {
            const cleaned = [...data];

            for (let i = 1; i < data.length; i++) {
                const delta = Math.abs(data[i] - data[i - 1]);

                if (delta > threshold) {
                    cleaned[i] = cleaned[i - 1];
                }
            }
            return cleaned;
        }


        function medianWFSFilter(data, windowSize = 15, baselineMax = 10, iqrK = 1.5) {
            const half = Math.floor(windowSize / 2);
            const result = [...data];

            function median(arr) {
                const sorted = [...arr].sort((a, b) => a - b);
                const mid = Math.floor(sorted.length / 2);
                return sorted.length % 2 !== 0
                    ? sorted[mid]
                    : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
            }

            function iqrBounds(arr) {
                const sorted = [...arr].sort((a, b) => a - b);
                const q1 = sorted[Math.floor(sorted.length * 0.25)];
                const q3 = sorted[Math.floor(sorted.length * 0.75)];
                const iqr = q3 - q1;
                return q3 + iqrK * iqr;   // upper bound only — spikes are always high
            }

            const runs = [];
            let runStart = null;
            for (let i = 0; i <= data.length; i++) {
                const isOn = i < data.length && data[i] > baselineMax;
                if (isOn && runStart === null) {
                    runStart = i;
                } else if (!isOn && runStart !== null) {
                    runs.push({ start: runStart, end: i - 1 });
                    runStart = null;
                }
            }

            for (const { start, end } of runs) {
                const runValues = data.slice(start, end + 1);
                const runMedian = median(runValues);
                const upperBound = iqrBounds(runValues);

                for (let i = start; i <= end; i++) {
                    const isSpike = data[i] > upperBound;

                    if (!isSpike) {
                        result[i] = data[i];
                        continue;
                    }

                    // replace with sliding median
                    const localStart = i - half;
                    const localEnd = i + half;
                    const isEdge = localStart < start || localEnd > end;

                    result[i] = isEdge
                        ? runMedian
                        : median(data.slice(localStart, localEnd + 1));
                }
            }

            return result;
        }

        function getSampledCols(cols, interval) {
            const timeColName = c.timeColumnName;

            const firstTorchOnIndex = cols[c.torchOnColumnName].findIndex(v => v == 1 || v == "1");
            const startIdx = firstTorchOnIndex === -1 ? 0 : firstTorchOnIndex;

            // truncate all columns to start from torch-on
            const truncatedCols = {};
            for (let key in cols) {
                truncatedCols[key] = cols[key].slice(startIdx);
            }

            const time = truncatedCols[timeColName];
            if (!time || time.length === 0) return {};

            const startTime = time[0];
            const endTime = time[time.length - 1];
            const sampledCols = {};
            for (let key in truncatedCols) sampledCols[key] = [];

            let currentRow = 0;
            for (let targetTime = startTime; targetTime <= endTime; targetTime += interval) {
                while (currentRow + 1 < time.length) {
                    const currentDelta = Math.abs(time[currentRow] - targetTime);
                    const nextDelta = Math.abs(time[currentRow + 1] - targetTime);
                    if (nextDelta <= currentDelta) {
                        currentRow++;
                    } else {
                        break;
                    }
                }
                // Add the closest row to our sampled columns
                for (let key in truncatedCols) {
                    sampledCols[key].push(truncatedCols[key][currentRow]);
                }
            }
            return sampledCols;
        }


        function createAnnotations(torchStatus, timeArray) {
            if (!torchStatus || !timeArray) return [];
            const annotations = [];
            let segStart = null;

            for (let i = 0; i <= torchStatus.length; i++) {
                const isOn = i < torchStatus.length && (torchStatus[i] === 1 || torchStatus[i] === "1" || torchStatus[i] === true);

                if (isOn && segStart === null) {
                    segStart = i;
                } else if (!isOn && segStart !== null) {
                    const xVal = timeArray[segStart];
                    const x2Val = timeArray[i - 1];

                    annotations.push({
                        x: xVal,
                        x2: x2Val,
                        fillColor: c.annotationColour,
                        borderColor: '#000',
                        opacity: 0.2,
                    });
                    segStart = null;
                }
            }

            return annotations;
        }


        function exportActiveCSV() {
            const view = dashboard.currentView;
            console.log(`Exporting ${view} data to CSV...`);

            const currentMeta = dashboard.data[view];
            if (!currentMeta) return;

            // Collect all chart series for this view
            const seriesList = [];
            Object.keys(currentMeta).forEach(key => {
                if (key.startsWith("#")) {
                    currentMeta[key].forEach(s => seriesList.push(s));
                }
            });

            if (seriesList.length === 0) return;

            // Build headers
            let headers = ["Time (S)"];
            seriesList.forEach(s => headers.push(s.name));
            const csvRows = [headers.join(",")];

            // Use the first series to determine the number of rows
            const rowCount = seriesList[0].data.length;

            for (let i = 0; i < rowCount; i++) {
                // Get the time from the first series
                let row = [seriesList[0].data[i].x];

                // Get the Y values from all series
                seriesList.forEach(s => {
                    row.push(s.data[i]?.y ?? "");
                });

                csvRows.push(row.join(","));
            }

            const csvString = csvRows.join("\n");
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);

            link.setAttribute("href", url);
            link.setAttribute("download", `${view}-data-${dateSuffix()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportCurrentPNG() {
            console.log("Exporting to PNG...");
            html2canvas(document.querySelector("#chart-area"), {
                scale: 3, // increase to increase output resolution
                logging: false,
                useCORS: true,
                allowTaint: false,
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = "all-" + (dashboard.currentView === c.rawFlag ? "raw" : "cleaned") + "-data-" + dateSuffix() + ".png";
                link.style.visibility = 'hidden';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function dateSuffix() {

            const now = new Date();

            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = String(now.getFullYear()).slice(-2);

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const hString = String(hours).padStart(2, '0');

            return `${day}-${month}-${year}_${hString}-${minutes}${ampm}`;
        }


        function mapToXY(seriesList, timeArray) {
            if (!timeArray) return [];
            return seriesList.map(s => ({
                name: s.name,
                data: (s.data || []).map((val, i) => ({
                    x: timeArray[i],
                    y: val
                }))
            }));
        }

        const cacheKey = "waam_cache";

        function persistData(data) {
            try {
                sessionStorage.setItem(cacheKey, JSON.stringify(data));
            } catch (e) {
                console.warn("Session storage unavailable or quota exceeded", e);
            }
        }

        function restoreData() {
            const cache = sessionStorage.getItem(cacheKey);
            if (cache) {
                console.log("Restoring data from session storage...");
                main({ data: JSON.parse(cache) }, true);
                return true;
            }
            return false;
        }

        function main(results, wasRestored = false) {
            let rows = results.data;
            if (!rows || rows.length === 0) return;

            if (!wasRestored) persistData(rows);

            // filter out empty rows
            rows = rows.filter(r => r && Object.keys(r).length > 0);

            columns = rows.reduce((acc, row) => {
                Object.keys(row).forEach((key) => {
                    if (!acc[key]) {
                        acc[key] = [];
                    }
                    acc[key].push(row[key]);
                });
                return acc;
            }, {});

            // parse and replace timestamp column
            const tsCol = c.timeColumnName;
            if (columns[tsCol] && columns[tsCol].length > 0) {
                const firstTs = new Date(columns[tsCol][0]).getTime() / 1000;
                columns[tsCol] = columns[tsCol].map(v => (new Date(v).getTime() / 1000) - firstTs);
            }

            const timeArray = columns[tsCol];

            const cleanedCols = {
                [c.timeColumnName]: timeArray,
                [c.torchOnColumnName]: columns[c.torchOnColumnName],
                [c.T1ColumnName]: hampelFilter(columns[c.T1ColumnName]),
                [c.T2ColumnName]: hampelFilter(columns[c.T2ColumnName]),
                [c.T3ColumnName]: hampelFilter(columns[c.T3ColumnName]),
                [c.T4ColumnName]: hampelFilter(columns[c.T4ColumnName]),
                [c.voltageColumnName]: rmsAvg(columns[c.voltageColumnName], c.voltageRMSthresh),
                [c.currentColumnName]: rmsAvg(columns[c.currentColumnName], c.currentRMSthresh),
                [c.WFSColumnName]: medianWFSFilter(columns[c.WFSColumnName])
            };

            const sampledCols = getSampledCols(cleanedCols, c.sampleInterval);
            const sampledTime = (sampledCols[c.timeColumnName] || []).map((v, i, arr) => v - arr[0]);

            const rawData = {
                "#chart-temp": mapToXY([
                    { name: "T1 (Raw)", data: columns[c.T1ColumnName] },
                    { name: "T3 (Raw)", data: columns[c.T3ColumnName] },
                    { name: "T4 (Raw)", data: columns[c.T4ColumnName] }
                ], timeArray),
                "#chart-volt": mapToXY([{ name: "Voltage (V Raw)", data: columns[c.voltageColumnName] }], timeArray),
                "#chart-cur": mapToXY([{ name: "Current (A Raw)", data: columns[c.currentColumnName] }], timeArray),
                "#chart-wfs": mapToXY([{ name: "WFS (mm/s Raw)", data: columns[c.WFSColumnName] }], timeArray),
                "#chart-torch-on": mapToXY([{ name: "Torch (Raw)", data: columns[c.torchOnColumnName] }], timeArray)
            };

            const cleanedData = {
                "#chart-temp": mapToXY([
                    { name: "T1 (Filtered)", data: cleanedCols[c.T1ColumnName] },
                    { name: "T3 (Filtered)", data: cleanedCols[c.T3ColumnName] },
                    { name: "T4 (Filtered)", data: cleanedCols[c.T4ColumnName] },
                ], timeArray),
                "#chart-volt": mapToXY([{ name: "Voltage (V RMS)", data: cleanedCols[c.voltageColumnName] }], timeArray),
                "#chart-cur": mapToXY([{ name: "Current (A RMS)", data: cleanedCols[c.currentColumnName] }], timeArray),
                "#chart-wfs": mapToXY([{ name: "WFS (mm/s Clipped)", data: cleanedCols[c.WFSColumnName] }], timeArray),
                "#chart-torch-on": rawData["#chart-torch-on"],
            };

            const sampledData = {
                "#chart-temp": mapToXY([
                    { name: "T1 (Sampled)", data: sampledCols[c.T1ColumnName] },
                    { name: "T3 (Sampled)", data: sampledCols[c.T3ColumnName] },
                    { name: "T4 (Sampled)", data: sampledCols[c.T4ColumnName] }
                ], sampledTime),
                "#chart-volt": mapToXY([{ name: "Voltage (V Sampled)", data: sampledCols[c.voltageColumnName] }], sampledTime),
                "#chart-cur": mapToXY([{ name: "Current (A Sampled)", data: sampledCols[c.currentColumnName] }], sampledTime),
                "#chart-wfs": mapToXY([{ name: "WFS (mm/s Sampled)", data: sampledCols[c.WFSColumnName] }], sampledTime),
                "#chart-torch-on": mapToXY([{ name: "Torch (Sampled)", data: sampledCols[c.torchOnColumnName] }], sampledTime)
            };

            const rawAnn = createAnnotations(columns[c.torchOnColumnName], timeArray); // annotations for raw data
            const sampledAnn = createAnnotations(sampledCols[c.torchOnColumnName], sampledTime); // annotations for sampled data

            dashboard.data.raw = { ...rawData, annotations: rawAnn };
            dashboard.data.cleaned = { ...cleanedData, annotations: rawAnn };
            dashboard.data.sampled = { ...sampledData, annotations: sampledAnn };

            allData = [
                { type: "raw", content: rawData },
                { type: "cleaned", content: cleanedData },
                { type: "sampled", content: sampledData }
            ];


            ann = rawAnn;

            dashboard.charts["#chart-temp"] = renderChart(rawData["#chart-temp"], "#chart-temp", "Temp (°C)");
            dashboard.charts["#chart-volt"] = renderChart(rawData["#chart-volt"], "#chart-volt", "Voltage (V)");
            dashboard.charts["#chart-cur"] = renderChart(rawData["#chart-cur"], "#chart-cur", "Current (A)");
            dashboard.charts["#chart-wfs"] = renderChart(rawData["#chart-wfs"], "#chart-wfs", "WFS (mm/S)");
            dashboard.charts["#chart-torch-on"] = renderChart(rawData["#chart-torch-on"], "#chart-torch-on", "Torch state");
            
            document.getElementById("toggle-view-btn").innerText = "Clean";
            updateViewIndicator();
        }


        window.addEventListener('message', (event) => {
            if (event.data.type === 'INITIAL_DATA') {
                const payload = event.data.payload;
                main({ data: payload });
            }
        });

        window.onload = () => {
            // check if the page is being reloaded, or if the user opened it directly
            const isReload = (performance.getEntriesByType("navigation")[0]?.type === "reload") ||
             (performance.navigation?.type === 1);

            if (isReload || !window.opener) {
                restoreData();
            } else {
                window.opener.postMessage('GRAPH_READY', '*');
            }
        };

        async function triggerFilePicker() {
            try {
                if (window.showOpenFilePicker) {
                    const [fileHandle] = await window.showOpenFilePicker({
                        startIn: 'Downloads',
                        types: [{ description: 'CSV Files', accept: { 'text/csv': ['.csv'] } }],
                        multiple: false
                    });
                    const file = await fileHandle.getFile();
                    handleFileImport(file);
                } else {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.csv';
                    input.onchange = e => handleFileImport(e.target.files[0]);
                    input.click();
                }
            } catch (err) {
                console.log("File selection cancelled", err);
            }
        }

        function handleFileImport(file) {
            if (!file) return;

            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                beforeFirstChunk: function () {
                    console.log("Fetching new data...");
                },
                complete: function (results) {
                    console.log("Opening new tab...");
                    const plotWindow = window.open('graph.html', 'WAAM_' + Date.now());

                    window.addEventListener('message', (event) => {
                        if (event.data === 'GRAPH_READY') {
                            plotWindow.postMessage({
                                type: 'INITIAL_DATA',
                                payload: results.data
                            }, '*');
                        }
                    }, { once: true });
                },
                error: function (error) {
                    console.error("Error parsing file:", error);
                    alert("Failed to parse CSV file.");
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('dropzone-overlay');

            document.addEventListener("dragenter", (e) => {
                e.preventDefault();
                if (e.dataTransfer.types.includes("Files")) {
                    overlay.classList.add("active");
                }
            });

            document.addEventListener("dragover", (e) => {
                e.preventDefault(); 
            });

            document.addEventListener("dragleave", (e) => {
                e.preventDefault();
                if (e.relatedTarget === null || e.relatedTarget === document.documentElement) {
                    overlay.classList.remove("active");
                }
            });

            document.addEventListener("drop", (e) => {
                e.preventDefault();
                overlay.classList.remove("active");

                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.name.toLowerCase().endsWith('.csv') || file.type === "text/csv") {
                        handleFileImport(file);
                    } else {
                        alert("Please drop a valid .csv file.");
                    }
                }
            });
        });


    </script>

</body>

</html>
